# --- experience ------------------------------------------------------------

[[experience]]
company  = "Nuglif (La Presse)"
location = "Montréal, QC"
role     = "Manager, Cloud Infrastructure & Cybersecurity"
start    = "June 2025"
end      = "present"
context  = """
Own the roadmap, budget and reliability of the platform.
"""
bullets = [
  "Took over the **GCP** environment: inventory, project structure, cost tracking, and a start on Terraform. Tightened permissions and limited access on the billing accounts.",
  "Put an internal analytics team's AWS account under governance: stopped manual production changes and fixed the security holes.",
  "Replaced permanent **IAM** users with SSO roles that have a limited session time, and changed the roles to cut down privileges.",
  "Deployed **Falco** in Kubernetes to detect threats at runtime, and tuned the macros to remove false positives.",
  "Set up a **CloudFront WAF** in front of the public frontend to limit AI bot traffic, keeping delivery cost in mind.",
  "Manage 5 people: four engineers and a database administrator.",
  "Build the yearly cloud and SaaS budget.",
]
tech = ["AWS", "GCP", "Terraform", "IAM", "SSO", "CloudFront", "Cost engineering"]

[[experience]]
company  = "Nuglif (La Presse)"
location = "Montréal, QC"
role     = "Systems Administrator (DevOps)"
start    = "2016"
end      = "2025"
context  = """
Ran about 1,200 VMs on VMware, set up and managed with Chef, then the early days of \
Kubernetes, then the move to AWS to deliver La Presse's daily editions.
"""
bullets = [
  "Proposed and led the move from self-managed Kubernetes to **EKS**, and replaced the **Weave** CNI where most of the instability came from: Kubernetes incidents went from about two a week to none.",
  "Set up the platform's disaster recovery plan: an **RTO under an hour** to publish fresh news again on isolated infrastructure, with no backup restored, and 12 hours for the main services. Tested the plan every quarter.",
  "Kept critical systems up to date, including the **Kubernetes** fleet. The **1.14 to 1.18** upgrade meant moving etcd2 to etcd3 and five to ten minutes with no API. It took preparation and a rehearsal before the change.",
  "Ran an alert review across the platform: fixed the recurring causes. Night calls dropped.",
  "Brought in **ArgoCD** and GitOps for the platform services.",
  "Took care of **Prometheus**, then helped move to Datadog.",
  "Replaced **Fluentd** with **Fluent Bit** for log shipping to **Splunk**: researched the tool, presented it to the team, and led the replacement.",
  "Was first on call on the 24/7 rotation from the early Kubernetes days.",
  "Split the **Terraform** code into modules by context.",
  "Cut the platform's blast radius: NetworkPolicies, security groups, least-privilege **RBAC** per service in Kubernetes and ArgoCD, and patching for published CVEs.",
  "Migrated the CDN from Cloudflare to **CloudFront**: a large recurring saving.",
]
tech = ["Kubernetes", "EKS", "Terraform", "ArgoCD", "Helm", "Prometheus", "Datadog", "AWS", "Chef", "Python"]

