# --- expérience ------------------------------------------------------------

[[experience]]
company  = "Nuglif (La Presse)"
location = "Montréal, QC"
role     = "Superviseur, infrastructure Cloud et cybersécurité"
start    = "juin 2025"
end      = "aujourd'hui"
context  = """
Responsable de la feuille de route, du budget et de la fiabilité de la plateforme.
"""
bullets = [
  "Prendre en main le parc **GCP**: inventaire, structure des projets, suivi des coûts, commencer IaC avec Terraform. Resserrer fortement les droits, limiter les accès sur les comptes de facturation.",
  "Mettre le compte AWS d'une équipe d'analytique interne sous gouvernance: arrêter les changements manuels en production et corriger les vulnérabilités de sécurité.",
  "Remplacer les utilisateurs **IAM** permanents par des rôles SSO à durée de session limitée et modifier les rôles pour diminuer les privilèges.",
  "Déployer **Falco** dans Kubernetes pour détecter les menaces à l'exécution et ajuster les macros pour éliminer les faux positifs.",
  "Configurer un **WAF CloudFront** devant le frontend public pour limiter le trafic des robots d'IA, en tenant compte du coût de diffusion.",
  "Superviser 5 employés: quatre ingénieurs et un administrateur de base de données.",
  "Faire le budget annuel cloud et SaaS.",
]
tech = ["AWS", "GCP", "Terraform", "IAM", "SSO", "CloudFront", "Coûts cloud"]

[[experience]]
company  = "Nuglif (La Presse)"
location = "Montréal, QC"
role     = "Administrateur système (DevOps)"
start    = "2016"
end      = "2025"
context  = """
Administrer un parc d'environ 1 200 VM sous VMware, configurées et gérées par Chef, puis les débuts de \
Kubernetes, ensuite migration vers AWS pour livrer les éditions quotidiennes de La Presse.
"""
bullets = [
  "Proposer puis mener la migration de Kubernetes autogéré vers **EKS**, remplacer le CNI **Weave** où logeait l'essentiel de l'instabilité: les incidents liés à Kubernetes sont passés d'environ deux par semaine à aucun.",
  "Établir le plan de relève de la plateforme: un **RTO de moins d'une heure** pour republier des nouvelles fraîches sur une infrastructure isolée, sans restaurer de sauvegarde, et 12 heures pour l'essentiel des services. Tester le plan chaque trimestre.",
  "Mettre à jour les différents systèmes critiques dont le parc de **Kubernetes**. La mise à jour K8S de **1.14 à 1.18** impliquait la transition etcd2 → etcd3 et cinq à dix minutes sans API. A nécessité préparation et répétition avant le changement.",
  "Mener une revue des alertes sur toute la plateforme: régler les causes récurrentes. Les appels de nuit ont chuté.",
  "Introduire **ArgoCD** et le GitOps pour les services de plateforme.",
  "Prendre **Prometheus** en charge puis contribuer au passage vers Datadog.",
  "Remplacer **Fluentd** par **Fluent Bit** pour l'envoi des journaux vers **Splunk**: étudier l'outil, le présenter à l'équipe et mener le remplacement.",
  "Assurer la garde 24/7 dès les débuts de Kubernetes, dont son premier incident sérieux en production.",
  "Découper le code **Terraform** en modules par contexte.",
  "Limiter la portée d'une compromission: NetworkPolicies, security groups, RBAC avec moindre privilège par service dans Kubernetes et ArgoCD, correctifs pour les CVE publiées.",
  "Migrer le CDN de Cloudflare vers **CloudFront**: économie récurrente importante.",
]
tech = ["Kubernetes", "EKS", "Terraform", "ArgoCD", "Helm", "Prometheus", "Datadog", "AWS", "Chef", "Python"]

